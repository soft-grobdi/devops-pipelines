name: Global · Container Smoke Test

# Levanta el stack del repo que llama con `docker compose` y confirma que un
# endpoint de salud responde antes de dar el build por bueno. Es la última
# validación antes de mergear/desplegar: si el contenedor arranca pero la
# app no sirve tráfico (falta una variable de entorno, un binario, una
# migración pendiente), esto lo agarra sin necesitar un despliegue real.
#
# No asume nada de PHP/Laravel: el docker-compose.yml y el endpoint de
# salud los define el repo que llama.
#
# Uso desde otro repo:
#
#   jobs:
#     smoketest:
#       needs: build   # el job que ya construyó y publicó la imagen en GHCR
#       uses: soft-grobdi/devops-pipelines/.github/workflows/global-container-smoketest.yml@v1
#       with:
#         health-path: /up
#         port: 8080
#         # Opcionales -- si se pasan, el stack usa la imagen que `build` ya
#         # construyó y publicó en vez de reconstruir desde cero (ver más
#         # abajo). local-image-tag debe coincidir con el `image:` que el
#         # docker-compose.yml del repo declara en el servicio de la app.
#         image-ref: ${{ needs.build.outputs.image-ref }}
#         local-image-tag: pedidos-grobdi:ci-local
#         # Si el docker-compose.yml del repo depende de un archivo que no
#         # está versionado (ej. un env_file con config local), setup-command
#         # es el lugar para generarlo antes de levantar el stack:
#         setup-command: |
#           cat > .env.docker <<'ENVEOF'
#           APP_KEY=base64:...
#           ENVEOF
#       permissions:
#         contents: read
#         packages: read

on:
  workflow_call:
    inputs:
      compose-file:
        description: "Ruta al docker-compose.yml del repo que llama"
        required: false
        type: string
        default: docker-compose.yml
      health-path:
        description: "Path del endpoint de salud (debe responder 2xx sin autenticación)"
        required: false
        type: string
        default: /up
      port:
        description: "Puerto publicado en el host por el servicio de la app"
        required: false
        type: number
        default: 8080
      timeout-seconds:
        description: "Cuánto esperar a que el endpoint de salud responda antes de fallar"
        required: false
        type: number
        default: 120
      setup-command:
        description: "Comando de shell opcional a correr antes de `docker compose up` (ej. escribir un archivo de entorno que el compose necesita y que no está versionado)"
        required: false
        type: string
        default: ""
      image-ref:
        description: "Referencia completa de una imagen ya construida (ej. la salida de global-docker-build). Si se da, el stack la usa en vez de reconstruir con `docker compose up --build`. Vacío = comportamiento de siempre (construye desde el Dockerfile)."
        required: false
        type: string
        default: ""
      local-image-tag:
        description: "Tag local al que se retagea image-ref antes de `docker compose up` -- debe coincidir exactamente con el `image:` del servicio de la app en compose-file, o Compose no la reconoce y reconstruye igual. Requerido si image-ref no está vacío."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  smoketest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preparación previa
        if: inputs.setup-command != ''
        # setup-command va por `env:` y se ejecuta con `eval`, no
        # interpolado directo en `run:` -- ${{ }} se sustituye como texto
        # plano ANTES de que bash vea el script, así que un valor con
        # comillas/`;` mal pensadas podría romper la estructura del script
        # que lo rodea (no solo correr como comando, sino inyectar
        # sentencias fuera de contexto). Ningún consumidor de hoy pasa algo
        # así, pero es una librería reutilizable -- no debe depender de que
        # seguirá siendo cierto.
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: eval "$SETUP_COMMAND"

      - name: Reusar la imagen ya construida (si se dio image-ref)
        if: inputs.image-ref != ''
        # Evita un tercer build de la misma imagen: el job `build` (que este
        # workflow normalmente corre después de) ya la construyó y publicó
        # en GHCR hace segundos. `docker compose up` sin `--build` no
        # reconstruye si el `image:` del servicio ya existe localmente --
        # por eso el pull+tag ANTES de levantar el stack, no después.
        env:
          IMAGE_REF: ${{ inputs.image-ref }}
          LOCAL_IMAGE_TAG: ${{ inputs.local-image-tag }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE_REF"
          docker tag "$IMAGE_REF" "$LOCAL_IMAGE_TAG"

      - name: Levantar stack
        # Sin --build cuando ya se retageó image-ref arriba: Compose no
        # reconstruye una imagen que ya existe localmente bajo el nombre
        # declarado en `image:`. Con --build cuando no se pasó image-ref,
        # para no romper a un consumidor que todavía no lo use.
        run: |
          if [ -n "${{ inputs.image-ref }}" ]; then
            docker compose -f "${{ inputs.compose-file }}" up -d
          else
            docker compose -f "${{ inputs.compose-file }}" up -d --build
          fi

      - name: Esperar respuesta saludable
        run: |
          deadline=$(( $(date +%s) + ${{ inputs.timeout-seconds }} ))
          url="http://localhost:${{ inputs.port }}${{ inputs.health-path }}"
          echo "Esperando ${url}"
          until curl -sf -o /dev/null "$url"; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Se agotó el tiempo (${{ inputs.timeout-seconds }}s) esperando ${url}"
              exit 1
            fi
            sleep 3
          done
          echo "OK: ${url} respondió"

      - name: Logs del stack (siempre, para diagnóstico)
        if: always()
        run: docker compose -f "${{ inputs.compose-file }}" logs

      - name: Apagar stack
        if: always()
        run: docker compose -f "${{ inputs.compose-file }}" down -v
