name: CI

# Valida los propios workflows de este repo antes de mergear un cambio.
# No construye ni despliega nada — es la barrera antes de que un YAML roto
# llegue a un tag que otros repos consumen.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        # Fijado por SHA, no por tag flotante v2 -- misma razón que Trivy en
        # global-security-scan.yml. v2.2.0 confirmada.
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true
