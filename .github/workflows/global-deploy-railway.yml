name: Global · Deploy to Railway

# Despliega el repo que llama al ambiente indicado usando la Railway CLI.
# El job declara `environment: <inputs.environment>` para heredar las
# reglas de protección (required reviewers) del GitHub Environment con ese
# nombre en el repo que llama — ahí vive el gate de aprobación manual
# (distinto grupo para development y para production). El token de Railway
# se recibe como secret explícito (`railway-token`), no por
# `secrets: inherit` — ver la nota en global-migrate.yml sobre por qué.
#
# Uso desde otro repo (normalmente después de global-migrate.yml):
#
#   jobs:
#     deploy:
#       needs: migrate
#       uses: soft-grobdi/devops-pipelines/.github/workflows/global-deploy-railway.yml@v1
#       with:
#         railway-service: pedidos-grobdi
#         environment: development
#       secrets:
#         railway-token: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}

on:
  workflow_call:
    inputs:
      railway-service:
        description: "Nombre del servicio en Railway"
        required: true
        type: string
      environment:
        description: "Nombre del GitHub Environment / ambiente de Railway (ej. development, production)"
        required: true
        type: string
    secrets:
      railway-token:
        description: "Project Token de Railway para el ambiente indicado"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Desplegar
        env:
          RAILWAY_TOKEN: ${{ secrets.railway-token }}
        run: |
          # No se pasa --environment: mismo motivo que en global-migrate.yml
          # -- el Project Token ya viene scoped a un ambiente. `railway up`
          # construye y despliega desde este checkout, en vez de reusar la
          # imagen que global-docker-build.yml/global-security-scan.yml ya
          # construyeron y escanearon -- por eso lo desplegado no es
          # literalmente lo escaneado, y por eso cada cambio se construye una
          # vez más de lo necesario.
          #
          # Investigado y descartado por ahora (2026-09-09): Railway soporta
          # un origen de servicio "Docker Image" que apunta a
          # ghcr.io/<owner>/<repo>:<tag> y se salta el build por completo,
          # reemplazando el builder DOCKERFILE de railway.json. Trae tres
          # costos que no se justifican todavía:
          #   1. Un registro PRIVADO (este lo es) requiere plan Pro de
          #      Railway -- a confirmar si el proyecto lo tiene.
          #   2. El cambio de origen se hace a mano en el dashboard, por
          #      servicio y por AMBIENTE (development y production por
          #      separado) -- no es algo que este workflow pueda aplicar la
          #      primera vez, y agrega credenciales GHCR (PAT read:packages)
          #      como config nueva a mantener dentro de Railway.
          #   3. `railway redeploy` (el comando para esta ruta) no bloquea
          #      hasta el estado terminal como `railway up` sin --detach --
          #      dispara y retorna. Recuperar el job verde/rojo real que ya
          #      tenemos hoy exigiría hacer polling manual contra la API
          #      GraphQL de Railway (`deployments { status }`), workflow más
          #      complejo por un beneficio que hoy es sobre todo velocidad.
          # Si el costo del build repetido se vuelve el cuello de botella
          # real (medido, no supuesto), retomar esto empezando por confirmar
          # el plan de Railway.
          #
          # -m/--message: railway up (CLI) no manda metadata de git como sí
          # hace la integración nativa Railway<->GitHub -- sin esto, todo
          # deployment aparece en el dashboard solo como "railway up / via
          # CLI". Con --message se ve el SHA corto y el asunto del commit
          # que realmente se está desplegando.
          #
          # SIN --detach a propósito: con --detach, el comando retorna en
          # cuanto Railway ACEPTA el build (encolado), no cuando el
          # despliegue realmente termina -- el job quedaba en verde aunque
          # el contenedor entrara en crashloop o nunca pasara el healthcheck
          # (/up, configurado en railway.json). Sin --detach, `railway up`
          # bloquea hasta el estado terminal del deployment (incluido ese
          # healthcheck) y su código de salida lo refleja: 0 solo si de
          # verdad quedó sano, 1 si falló o se cayó. El costo es que el job
          # tarda lo que tarde el deploy real, en vez de retornar al toque.
          railway up \
            --service "${{ inputs.railway-service }}" \
            --message "$(git log -1 --pretty=format:'%h %s')"
