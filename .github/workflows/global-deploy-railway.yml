name: Global · Deploy to Railway

# Despliega el repo que llama al ambiente indicado usando la Railway CLI.
# El job declara `environment: <inputs.environment>` para heredar las
# reglas de protección (required reviewers) del GitHub Environment con ese
# nombre en el repo que llama — ahí vive el gate de aprobación manual
# (distinto grupo para development y para production). El token de Railway
# se recibe como secret explícito (`railway-token`), no por
# `secrets: inherit` — ver la nota en global-migrate.yml sobre por qué.
#
# Uso desde otro repo (normalmente después de global-migrate.yml):
#
#   jobs:
#     deploy:
#       needs: migrate
#       uses: soft-grobdi/devops-pipelines/.github/workflows/global-deploy-railway.yml@v1
#       with:
#         railway-service: pedidos-grobdi
#         environment: development
#       secrets:
#         railway-token: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}

on:
  workflow_call:
    inputs:
      railway-service:
        description: "Nombre del servicio en Railway"
        required: true
        type: string
      environment:
        description: "Nombre del GitHub Environment / ambiente de Railway (ej. development, production)"
        required: true
        type: string
    secrets:
      railway-token:
        description: "Project Token de Railway para el ambiente indicado"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Desplegar
        env:
          RAILWAY_TOKEN: ${{ secrets.railway-token }}
        run: |
          # No se pasa --environment: mismo motivo que en global-migrate.yml
          # -- el Project Token ya viene scoped a un ambiente. `railway up`
          # construye y despliega desde este checkout. Si más adelante
          # conviene desplegar exactamente la imagen que ya construyó y
          # escaneó global-docker-build.yml/global-security-scan.yml en vez
          # de reconstruir aquí, revisar el mecanismo de Railway para
          # desplegar desde una imagen de registro en vez de build-from-source.
          #
          # -m/--message: railway up (CLI) no manda metadata de git como sí
          # hace la integración nativa Railway<->GitHub -- sin esto, todo
          # deployment aparece en el dashboard solo como "railway up / via
          # CLI". Con --message se ve el SHA corto y el asunto del commit
          # que realmente se está desplegando.
          railway up \
            --service "${{ inputs.railway-service }}" \
            --message "$(git log -1 --pretty=format:'%h %s')" \
            --detach
