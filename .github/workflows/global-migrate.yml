name: Global · Run Migrations

# Corre el comando de migración indicado contra la base real de un ambiente
# de Railway, SIN desplegar código nuevo. Separado del deploy a propósito:
# si la migración falla, el deploy nunca llega a intentarse.
#
# El job declara `environment: <inputs.environment>` para heredar las
# reglas de protección (required reviewers) del GitHub Environment con ese
# nombre en el repo que llama. El token de Railway se recibe como secret
# explícito (`railway-token`), NO por `secrets: inherit`: los secrets
# scoped a un Environment no se propagan por inherit a un job de otro repo
# que solo declara el environment como input de texto -- hay que pasarlos
# a mano. Se recomienda un secret de repo por ambiente (ej.
# RAILWAY_TOKEN_DEVELOPMENT, RAILWAY_TOKEN_PRODUCTION) que el repo que
# llama selecciona según el ambiente resuelto.
#
# migrate-command no asume Laravel — el valor por defecto es artisan, pero
# un futuro servicio Node puede pasar el suyo (ej. `npx drizzle-kit migrate`).
#
# `railway run` NO ejecuta el comando dentro del contenedor ya desplegado:
# lo corre en ESTE runner, solo inyectándole las variables de entorno del
# ambiente de Railway. Por eso el job hace checkout del código y, si hace
# falta, instala el toolchain (php-version) y las dependencias
# (setup-command) antes de correr migrate-command -- sin esto, `artisan`
# (o el equivalente del stack que sea) no existe en el runner.
#
# Uso desde otro repo:
#
#   jobs:
#     migrate:
#       needs: [ci]  # o el job que agrupe los checks previos
#       uses: soft-grobdi/devops-pipelines/.github/workflows/global-migrate.yml@v1
#       with:
#         railway-service: pedidos-grobdi
#         environment: development
#         php-version: "8.2"
#         setup-command: composer install --prefer-dist --no-progress --no-interaction
#       secrets:
#         railway-token: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}
#         # Opcionales -- un usuario de DB dedicado a migración, scoped
#         # solo al esquema de la app, en vez de las credenciales completas
#         # que Railway inyecta por defecto. Se omiten si no aplica.
#         db-migrator-username: ${{ secrets.DB_MIGRATOR_USERNAME_DEVELOPMENT }}
#         db-migrator-password: ${{ secrets.DB_MIGRATOR_PASSWORD_DEVELOPMENT }}

on:
  workflow_call:
    inputs:
      railway-service:
        description: "Nombre del servicio en Railway"
        required: true
        type: string
      environment:
        description: "Nombre del GitHub Environment / ambiente de Railway (ej. development, production)"
        required: true
        type: string
      migrate-command:
        description: "Comando a ejecutar dentro del servicio para aplicar migraciones pendientes"
        required: false
        type: string
        default: "php artisan migrate --force"
      php-version:
        description: "Versión de PHP a instalar en el runner antes de migrar (vacío = no instalar PHP, ej. para un stack Node)"
        required: false
        type: string
        default: ""
      setup-command:
        description: "Comando para instalar dependencias antes de migrar (ej. composer install, npm ci)"
        required: false
        type: string
        default: ""

    secrets:
      railway-token:
        description: "Project Token de Railway para el ambiente indicado"
        required: true
      db-migrator-username:
        description: "Usuario de base de datos a inyectar como DB_USERNAME antes de migrate-command (opcional -- un usuario dedicado a migración, scoped solo al esquema de la app, en vez de heredar las credenciales completas que Railway inyecta por defecto). Vacío = no sobreescribir."
        required: false
      db-migrator-password:
        description: "Contraseña del usuario anterior, inyectada como DB_PASSWORD"
        required: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - if: inputs.php-version != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - if: inputs.setup-command != ''
        name: Instalar dependencias
        run: ${{ inputs.setup-command }}

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Ejecutar migraciones
        env:
          RAILWAY_TOKEN: ${{ secrets.railway-token }}
        run: |
          # No se pasa --environment: un Project Token de Railway ya viene
          # scoped a un ambiente específico (por eso hay un RAILWAY_TOKEN
          # distinto por GitHub Environment). Pasarlo redundante contra un
          # token ya scoped no está documentado -- se prefiere confiar en
          # el scope del token antes que arriesgar un flag sin confirmar
          # contra un ambiente real. --service sí es necesario si el
          # proyecto de Railway tiene más de un servicio.
          #
          # db-migrator-username/password NO pueden ir embebidos en
          # migrate-command por el repo que llama: el contexto `secrets` no
          # es accesible dentro de `with:` (solo dentro de `secrets:`, que
          # es donde este repo los recibe). Por eso se splicean acá, en
          # texto plano dentro del script -- igual que DB_HOST/DB_PORT hoy,
          # `env VAR=valor cmd` exporta la variable al proceso hijo (`sh -c
          # '...'` de migrate-command y, con él, a `php artisan` adentro).
          if [ -n "${{ secrets.db-migrator-username }}" ]; then
            railway run \
              --service "${{ inputs.railway-service }}" \
              -- env DB_USERNAME="${{ secrets.db-migrator-username }}" DB_PASSWORD="${{ secrets.db-migrator-password }}" ${{ inputs.migrate-command }}
          else
            railway run \
              --service "${{ inputs.railway-service }}" \
              -- ${{ inputs.migrate-command }}
          fi
