name: Global · Run Migrations

# Corre el comando de migración contra la base real de un ambiente, SIN
# desplegar código. Separado del deploy a propósito: si la migración
# falla, el deploy nunca se intenta.
#
# `railway run` NO ejecuta dentro del contenedor desplegado: corre el
# comando en ESTE runner, inyectándole las variables del ambiente. Por eso
# el job hace checkout, instala el toolchain (php-version / node-version)
# y las dependencias (setup-command) antes de migrar.
#
# Agnóstico del stack: migrate-command es obligatorio (no hay un default
# válido para todos), y las variables que la migración necesita
# sobreescribir se pasan por el secret `migrate-env` como líneas KEY=value.
# Se aplican DENTRO de `railway run` (vía `env`), así ganan a las que
# Railway inyecta -- el caso típico es apuntar la base al endpoint público
# (TCP proxy), porque el runner no alcanza la red privada de Railway.
#
#   Laravel:  migrate-env: |
#               DB_HOST=${{ vars.DB_PUBLIC_HOST }}
#               DB_USERNAME=${{ secrets.DB_MIGRATOR_USERNAME }}
#               DB_PASSWORD=${{ secrets.DB_MIGRATOR_PASSWORD }}
#   Drizzle:  migrate-env: |
#               DATABASE_URL=${{ secrets.DATABASE_URL_PUBLIC }}
#
# Uso:
#
#   jobs:
#     migrate:
#       uses: soft-grobdi/devops-pipelines/.github/workflows/global-migrate.yml@v1
#       with:
#         railway-service: ms-cross-storage
#         environment: development
#         node-version: "24"
#         setup-command: pnpm install --frozen-lockfile
#         migrate-command: pnpm --filter @org/ms-cross-storage db:migrate
#       secrets:
#         railway-token: ${{ secrets.RAILWAY_TOKEN_DEVELOPMENT }}
#         migrate-env: |
#           DATABASE_URL=${{ secrets.DATABASE_URL_PUBLIC_DEVELOPMENT }}

on:
  workflow_call:
    inputs:
      railway-service:
        description: "Nombre del servicio en Railway"
        required: true
        type: string
      environment:
        description: "Nombre del GitHub Environment / ambiente de Railway (ej. development, production)"
        required: true
        type: string
      migrate-command:
        description: "Comando que aplica las migraciones pendientes"
        required: true
        type: string
      php-version:
        description: "Versión de PHP a instalar en el runner (vacío = no instalar)"
        required: false
        type: string
        default: ""
      node-version:
        description: "Versión de Node a instalar en el runner (vacío = no instalar). Habilita corepack; el repo que llama debe declarar `packageManager` en su package.json para fijar la versión de pnpm/yarn"
        required: false
        type: string
        default: ""
      setup-command:
        description: "Comando para instalar dependencias antes de migrar (ej. composer install, pnpm install --frozen-lockfile)"
        required: false
        type: string
        default: ""

    secrets:
      railway-token:
        description: "Project Token de Railway para el ambiente indicado"
        required: true
      migrate-env:
        description: "Variables a sobreescribir solo durante migrate-command, una por línea (KEY=value). Vacío = ninguna"
        required: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - if: inputs.php-version != ''
        # Fijado por SHA, no por tag flotante -- misma razón que Trivy en
        # global-security-scan.yml. 2.37.2 confirmada.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - if: inputs.node-version != ''
        # v7.0.0 confirmada contra la API de GitHub.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - if: inputs.node-version != ''
        run: corepack enable

      - if: inputs.setup-command != ''
        name: Instalar dependencias
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: eval "$SETUP_COMMAND"

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Ejecutar migraciones
        # Todo por `env:`, nada interpolado en `run:` -- ${{ }} se sustituye
        # como texto ANTES de que bash vea el script; un valor con comillas o
        # `;` rompería la estructura, no solo el comando.
        #
        # Cada línea de migrate-env se vuelve un argumento de `env` por
        # separado (array de bash), así un valor con espacios, `&` o `?`
        # (típico en una URL de conexión) llega intacto. Con migrate-env
        # vacío el array queda vacío y `env` solo ejecuta el comando.
        #
        # No se pasa --environment: el Project Token ya viene scoped a un
        # ambiente. --service sí, porque el proyecto puede tener varios.
        env:
          RAILWAY_TOKEN: ${{ secrets.railway-token }}
          MIGRATE_COMMAND: ${{ inputs.migrate-command }}
          MIGRATE_ENV: ${{ secrets.migrate-env }}
        run: |
          overrides=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            overrides+=("$line")
          done <<< "$MIGRATE_ENV"

          railway run \
            --service "${{ inputs.railway-service }}" \
            -- env "${overrides[@]}" sh -c "$MIGRATE_COMMAND"
