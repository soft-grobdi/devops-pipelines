name: Global · Docker Build

# Construye una imagen Docker y la sube a GHCR (ghcr.io), etiquetada con el
# SHA del commit. No asume nada de PHP/Laravel: el Dockerfile y el contexto
# los define el repo que llama a este workflow.
#
# Uso desde otro repo:
#
#   jobs:
#     build:
#       uses: soft-grobdi/devops-pipelines/.github/workflows/global-docker-build.yml@v1
#       with:
#         image-name: pedidos-grobdi
#       permissions:
#         contents: read
#         packages: write

on:
  workflow_call:
    inputs:
      image-name:
        description: "Nombre de la imagen, sin registro ni tag (ej. pedidos-grobdi)"
        required: true
        type: string
      dockerfile-path:
        description: "Ruta al Dockerfile"
        required: false
        type: string
        default: Dockerfile
      context:
        description: "Directorio de contexto del build"
        required: false
        type: string
        default: .
      build-args:
        description: "Build args, uno por línea (KEY=value)"
        required: false
        type: string
        default: ""
    outputs:
      image-ref:
        description: "Referencia completa de la imagen construida (registro/nombre:tag)"
        value: ${{ jobs.build.outputs.image-ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.meta.outputs.image-ref }}
    steps:
      # actions/checkout aquí clona el repo QUE LLAMA a este workflow, sobre
      # un runner Linux sensible a mayúsculas — igual que el runner de
      # Railway. Cualquier archivo cuya ruta en git no coincida en
      # mayúsculas con su namespace/import se ve como fallo de build aquí,
      # sin necesitar diagnóstico manual en un contenedor local.
      - uses: actions/checkout@v4

      - name: Resolver referencia de imagen
        id: meta
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}"
          TAG="${{ github.sha }}"
          echo "image-ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile-path }}
          push: true
          tags: ${{ steps.meta.outputs.image-ref }}
          build-args: ${{ inputs.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
