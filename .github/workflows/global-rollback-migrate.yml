name: Global · Rollback Migrations

# Revierte migraciones ya aplicadas contra la base real de un ambiente.
# Deliberadamente NUNCA se dispara solo — este workflow es `workflow_call`,
# así que necesita un wrapper en el repo que llama activado por
# `workflow_dispatch` (botón "Run workflow" en la pestaña Actions, nunca un
# push ni una reacción automática a un deploy fallido).
#
# Revertir esquema que ya corrió contra datos reales es riesgoso: puede
# perder datos que la migración transformó o generó. Por eso pasa por la
# MISMA aprobación que un deploy a ese ambiente (mismo `environment:`) — en
# production, la aprueba el mismo equipo de release, nunca queda a un clic
# de distancia de un incidente en caliente. El estándar recomendado es
# preferir un forward-fix (una migración nueva que corrige el problema)
# antes que revertir la que ya está aplicada; este workflow existe para el
# caso en que la migración corrió hace segundos y se confirma que ningún
# dato real la usó todavía.
#
# El token de Railway se recibe como secret explícito (`railway-token`), NO
# por `secrets: inherit`: mismo motivo que en global-migrate.yml -- los
# secrets scoped a un Environment no se propagan por inherit a un job de
# otro repo que solo declara el environment como input de texto. Se
# recomienda un secret de repo por ambiente (ej. RAILWAY_TOKEN_DEVELOPMENT,
# RAILWAY_TOKEN_PRODUCTION) que el repo que llama selecciona según el
# ambiente elegido en el `workflow_dispatch`.
#
# `railway run` NO ejecuta el comando dentro del contenedor ya desplegado:
# lo corre en ESTE runner, igual que en global-migrate.yml -- por eso este
# job también hace checkout y, si hace falta, instala el toolchain
# (php-version) y las dependencias (setup-command) antes de correr
# rollback-command.
#
# Uso desde otro repo:
#
#   # .github/workflows/rollback-migrate.yml del repo que llama
#   on:
#     workflow_dispatch:
#       inputs:
#         environment:
#           type: choice
#           options: [development, production]
#         steps:
#           type: number
#           default: 1
#   jobs:
#     rollback:
#       uses: soft-grobdi/devops-pipelines/.github/workflows/global-rollback-migrate.yml@v1
#       with:
#         railway-service: pedidos-grobdi
#         environment: ${{ inputs.environment }}
#         steps: ${{ inputs.steps }}
#         php-version: "8.2"
#         setup-command: composer install --prefer-dist --no-progress --no-interaction --no-scripts
#       secrets:
#         railway-token: ${{ inputs.environment == 'production' && secrets.RAILWAY_TOKEN_PRODUCTION || secrets.RAILWAY_TOKEN_DEVELOPMENT }}
#         # Opcionales -- mismo usuario dedicado a migración que
#         # global-migrate.yml. Se omiten si no aplica.
#         db-migrator-username: ${{ inputs.environment == 'production' && secrets.DB_MIGRATOR_USERNAME_PRODUCTION || secrets.DB_MIGRATOR_USERNAME_DEVELOPMENT }}
#         db-migrator-password: ${{ inputs.environment == 'production' && secrets.DB_MIGRATOR_PASSWORD_PRODUCTION || secrets.DB_MIGRATOR_PASSWORD_DEVELOPMENT }}

on:
  workflow_call:
    inputs:
      railway-service:
        description: "Nombre del servicio en Railway"
        required: true
        type: string
      environment:
        description: "Nombre del GitHub Environment / ambiente de Railway (ej. development, production)"
        required: true
        type: string
      steps:
        description: "Lotes de migración a revertir (solo aplica al comando por defecto de Laravel)"
        required: false
        type: number
        default: 1
      rollback-command:
        description: "Comando completo de rollback. Si se omite, usa el de Laravel con --step=<steps>"
        required: false
        type: string
        default: ""
      php-version:
        description: "Versión de PHP a instalar en el runner antes de revertir (vacío = no instalar PHP, ej. para un stack Node)"
        required: false
        type: string
        default: ""
      setup-command:
        description: "Comando para instalar dependencias antes de revertir (ej. composer install, npm ci)"
        required: false
        type: string
        default: ""

    secrets:
      railway-token:
        description: "Project Token de Railway para el ambiente indicado"
        required: true
      db-migrator-username:
        description: "Usuario de base de datos a inyectar como DB_USERNAME antes de rollback-command (opcional -- un usuario dedicado a migración, scoped solo al esquema de la app, en vez de heredar las credenciales completas que Railway inyecta por defecto). Vacío = no sobreescribir."
        required: false
      db-migrator-password:
        description: "Contraseña del usuario anterior, inyectada como DB_PASSWORD"
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - if: inputs.php-version != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - if: inputs.setup-command != ''
        name: Instalar dependencias
        run: ${{ inputs.setup-command }}

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Revertir migraciones
        env:
          RAILWAY_TOKEN: ${{ secrets.railway-token }}
        run: |
          # No se pasa --environment: mismo motivo que en global-migrate.yml
          # -- el Project Token ya viene scoped a un ambiente. --service sí
          # es necesario si el proyecto de Railway tiene más de un servicio.
          #
          # El comando por defecto se resuelve en la propia expresión de
          # `${{ }}` (no con un `if` de shell) para poder interpolarlo
          # directo en la línea de `railway run --`, igual que
          # migrate-command en global-migrate.yml -- necesario cuando el
          # repo que llama envuelve el comando en `sh -c '...'` (por
          # ejemplo, para overridear DB_HOST/DB_PORT antes de revertir).
          #
          # db-migrator-username/password: mismo motivo que en
          # global-migrate.yml -- el contexto `secrets` no es accesible
          # dentro de `with:` del repo que llama, así que se splicean acá.
          if [ -n "${{ secrets.db-migrator-username }}" ]; then
            railway run \
              --service "${{ inputs.railway-service }}" \
              -- env DB_USERNAME="${{ secrets.db-migrator-username }}" DB_PASSWORD="${{ secrets.db-migrator-password }}" ${{ inputs.rollback-command != '' && inputs.rollback-command || format('php artisan migrate:rollback --step={0} --force', inputs.steps) }}
          else
            railway run \
              --service "${{ inputs.railway-service }}" \
              -- ${{ inputs.rollback-command != '' && inputs.rollback-command || format('php artisan migrate:rollback --step={0} --force', inputs.steps) }}
          fi

